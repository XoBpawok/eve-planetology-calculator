<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="void" cx="30%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#0d1a2c"/>
      <stop offset="45%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <radialGradient id="nebula-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38e4ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1b8fa8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1b8fa8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c34dff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#7a2fb0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7a2fb0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a29" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#ff7a29" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff7a29" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planet-body" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#8fd8ff"/>
      <stop offset="28%" stop-color="#4fa9d9"/>
      <stop offset="55%" stop-color="#2c6f9e"/>
      <stop offset="78%" stop-color="#163f60"/>
      <stop offset="100%" stop-color="#081a2b"/>
    </radialGradient>

    <radialGradient id="planet-terminator" cx="72%" cy="66%" r="60%">
      <stop offset="0%" stop-color="#010509" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#010509" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#010509" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb443" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffe1b0" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffb443" stop-opacity="0.28"/>
      <stop offset="82%" stop-color="#ffe1b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb443" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="moon-body" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="60%" stop-color="#9fb9cc"/>
      <stop offset="100%" stop-color="#3d4d5c"/>
    </radialGradient>

    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e0" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ffdf9e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffdf9e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#void)"/>
  <rect width="1920" height="1080" fill="url(#nebula-cyan)" transform="translate(120,-100)"/>
  <rect width="1920" height="1080" fill="url(#nebula-magenta)" transform="translate(700,300) scale(1.3)"/>
  <rect width="1920" height="1080" fill="url(#nebula-orange)" transform="translate(-300,500) scale(1.1)"/>

  <!-- distant star -->
  <circle cx="260" cy="190" r="90" fill="url(#sun-glow)"/>
  <circle cx="260" cy="190" r="7" fill="#fff9ec"/>

  <!-- stray stars (scattered, hand-placed) -->
  <g fill="#ffffff">
    <circle cx="90" cy="620" r="1.6" opacity="0.8"/>
    <circle cx="180" cy="820" r="1.2" opacity="0.6"/>
    <circle cx="340" cy="450" r="1.8" opacity="0.9"/>
    <circle cx="470" cy="760" r="1.3" opacity="0.55"/>
    <circle cx="560" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="640" cy="900" r="1.6" opacity="0.75"/>
    <circle cx="820" cy="200" r="1.2" opacity="0.5"/>
    <circle cx="980" cy="500" r="1.8" opacity="0.85"/>
    <circle cx="1120" cy="150" r="1.3" opacity="0.6"/>
    <circle cx="1300" cy="380" r="1.5" opacity="0.7"/>
    <circle cx="1500" cy="120" r="1.7" opacity="0.85"/>
    <circle cx="1650" cy="480" r="1.3" opacity="0.55"/>
    <circle cx="1800" cy="220" r="1.6" opacity="0.8"/>
    <circle cx="140" cy="960" r="1.4" opacity="0.6"/>
    <circle cx="420" cy="980" r="1.2" opacity="0.5"/>
    <circle cx="760" cy="700" r="1.5" opacity="0.65"/>
    <circle cx="960" cy="900" r="1.3" opacity="0.55"/>
    <circle cx="1200" cy="820" r="1.6" opacity="0.75"/>
    <circle cx="60" cy="300" r="1.3" opacity="0.6"/>
    <circle cx="1900" cy="700" r="1.5" opacity="0.7"/>
  </g>

  <!-- ring, back half (behind planet) -->
  <g transform="translate(1430,760) rotate(-18)">
    <ellipse cx="0" cy="0" rx="430" ry="120" fill="none" stroke="url(#ring-grad)" stroke-width="26" opacity="0.9"/>
  </g>

  <!-- planet -->
  <circle cx="1430" cy="760" r="260" fill="url(#planet-body)"/>
  <circle cx="1430" cy="760" r="260" fill="url(#planet-terminator)"/>

  <!-- ring, front half (in front of planet) -->
  <g transform="translate(1430,760) rotate(-18)">
    <path d="M -430 0 A 430 120 0 0 0 430 0" fill="none" stroke="url(#ring-grad)" stroke-width="30" opacity="0.95"/>
  </g>

  <!-- small moon -->
  <circle cx="1120" cy="470" r="34" fill="url(#moon-body)"/>
</svg>
